name: Source safety

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Validate source safety invariants
        shell: bash
        run: |
          set -euo pipefail
          test -s source_code

          # The prototype must keep AppX identifiers explicit and avoid
          # PowerShell execution-policy bypasses or dynamic command evaluation.
          if grep -En -- '-ExecutionPolicy[[:space:]]+Bypass|Invoke-Expression|iex[[:space:](]' source_code; then
            echo "Unsafe PowerShell execution pattern detected."
            exit 1
          fi

          # Removal must stay scoped to the current user's explicitly named
          # packages. Provisioned-package and all-user removal would broaden
          # the impact beyond the prototype's documented safety boundary.
          if grep -En -- '-AllUsers|Get-AppxProvisionedPackage|Remove-AppxProvisionedPackage' source_code; then
            echo "Broad or provisioned AppX removal pattern detected."
            exit 1
          fi

          # Wildcard package names would turn an explicit allow-list into a
          # pattern match and could remove more packages than the UI selected.
          if grep -En -- 'Get-AppxPackage[[:space:]]+-Name[[:space:]]+[^\n]*[?*]' source_code; then
            echo "Wildcard AppX package selection detected."
            exit 1
          fi

          grep -F 'Get-AppxPackage -Name' source_code >/dev/null
          grep -F 'Remove-AppxPackage -ErrorAction Stop' source_code >/dev/null
          grep -F 'process.WaitForExit(30000)' source_code >/dev/null
          grep -F 'process.Kill();' source_code >/dev/null
          grep -F 'DialogResult.Yes' source_code >/dev/null
